<div class="contacto-container">
    <h2>Contacto</h2>
    
    <!-- Redes Sociales -->
    <div class="redes-sociales">
      <a href="https://instagram.com/tu_tienda" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com/tu_tienda" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://twitter.com/tu_tienda" target="_blank"><i class="fab fa-twitter"></i></a>
      <a href="https://www.tiktok.com/@tu_tienda" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>
    
    <!-- Formulario de contacto -->
    <form class="formulario-contacto">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required />
      
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required />
      
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" required></textarea>
      
      <button type="submit">Enviar</button>
    </form>
    
    <!-- Información adicional -->
    <div class="informacion-adicional">
      <p>Dirección: Calle Ficticia 123, Ciudad</p>
      <p>Horario: Lunes - Viernes, 9:00 - 18:00</p>
      <p>Teléfono: +123 456 789</p>
    </div>
